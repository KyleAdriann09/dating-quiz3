<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Build your plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;
  --ink:#14110F;
  --ink-soft:#6E6862;
  --line:#E7E4E0;
  --chip:#F5F3F0;
  --btn:#14110F;
  --btn-ink:#FFFFFF;
  --sel:#14110F;
  --sel-wash:#F6F5F3;
  --track:#E7E4E0;
  --ok:#2E7D4F;
  --bad:#C9503C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  font-family:Poppins,system-ui,-apple-system,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
.shell{width:100%;max-width:440px;padding:14px 20px 32px;display:flex;flex-direction:column;min-height:100vh}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:12px;min-height:36px}
.back{
  background:none;border:0;padding:6px;margin-left:-6px;cursor:pointer;
  color:var(--ink);line-height:0;border-radius:8px;
}
.back:hover{background:var(--chip)}
.back[hidden]{visibility:hidden}
.chip{
  margin:0 auto;padding:7px 16px;border:1px solid var(--line);border-radius:99px;
  font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;
}
.logo{margin:0 auto;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.logo .mark{
  width:26px;height:26px;border-radius:6px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:700;
}
.pad{width:32px;flex:none}

/* ---------- segmented progress ---------- */
.segs{display:flex;gap:6px;justify-content:center;margin:14px 0 22px}
.segs[hidden]{display:none}
.seg{width:40px;height:4px;border-radius:99px;background:var(--track);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* ---------- type ---------- */
h1{font-size:22px;font-weight:700;line-height:1.3;letter-spacing:-.01em;text-align:center}
h1.left{text-align:left;font-size:26px}
.sub{margin-top:6px;font-size:14px;color:var(--ink-soft);text-align:center}
.para{margin-top:12px;font-size:15px;line-height:1.6;color:var(--ink-soft)}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:11px;margin-top:22px}
.opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover{border-color:#CFCBC6}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt .ico{
  flex:none;width:34px;height:34px;border-radius:50%;background:var(--chip);
  display:grid;place-items:center;line-height:0;
}
.opt .txt{flex:1;line-height:1.35}
.opt .box{
  flex:none;width:20px;height:20px;border-radius:50%;
  border:1.5px solid #CFCBC6;transition:border-width .15s,border-color .15s;
}
.opt[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-wash)}
.opt[aria-pressed="true"] .box{border:6px solid var(--sel)}
.opt[aria-pressed="true"] .ico{background:#E7E4E0}

/* ---------- buttons ---------- */
.cta{
  width:100%;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--btn-ink);background:var(--btn);
  border:0;border-radius:99px;padding:18px;cursor:pointer;
  transition:opacity .15s,transform .1s;
}
.cta:hover{opacity:.9}
.cta:active{transform:scale(.99)}
.cta:disabled{opacity:.3;cursor:default}
.foot{margin-top:auto;padding-top:26px}
.grow{flex:1;display:flex;flex-direction:column}

/* ---------- media placeholder ---------- */
.shot-note{
  margin-top:18px;border:1px dashed var(--line);border-radius:14px;
  aspect-ratio:4/3;display:grid;place-items:center;text-align:center;
  color:var(--ink-soft);font-size:13px;padding:24px;line-height:1.55;
}

/* ---------- loading ---------- */
.rows{margin-top:28px;display:flex;flex-direction:column;gap:20px}
.row .lab{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500;margin-bottom:9px}
.row .bar{height:5px;background:var(--track);border-radius:99px;overflow:hidden}
.row .bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .4s linear}
.tick{color:var(--ok);line-height:0}
.pct{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* ---------- summary ---------- */
.panel{margin-top:20px;border:1px solid var(--line);border-radius:16px;padding:18px}
.panel .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.panel .hd b{font-size:15px;font-weight:600}
.badge{padding:5px 12px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.gauge{height:9px;border-radius:99px;background:linear-gradient(90deg,#C9503C,#D9992B,#2E7D4F);position:relative;margin:8px 0 8px}
.gauge .pin{
  position:absolute;top:50%;left:8%;width:19px;height:19px;border-radius:50%;
  background:#fff;border:2.5px solid var(--ink);transform:translate(-50%,-50%);
  transition:left .6s cubic-bezier(.4,0,.2,1);
}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft)}
.note{margin-top:18px;background:var(--chip);border-radius:12px;padding:14px}
.note b{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.note span{font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:13px;padding:13px}
.tile small{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px}
.tile b{font-size:15px;font-weight:600}

/* ---------- form ---------- */
.inp{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);margin-top:24px;
  padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;
}
.inp:focus{outline:none;border-color:var(--ink)}
.inp::placeholder{color:#A9A39D}
.err{margin-top:10px;font-size:13px;color:var(--bad);text-align:center}
.err[hidden]{display:none}
.fine{margin-top:16px;font-size:12px;line-height:1.55;color:var(--ink-soft);text-align:center}
.trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.legal{margin-top:18px;font-size:11.5px;line-height:1.6;color:var(--ink-soft);text-align:center}
.legal a{color:var(--ink-soft)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <div class="top" id="top"></div>
  <div class="segs" id="segs"></div>
  <div id="stage" class="grow" aria-live="polite"></div>
</main>

<script>
// =========================================================================
// CONFIG — everything the funnel says lives in SCREENS.
// =========================================================================

var BRAND         = "DF";
var BRAND_NAME    = "Dating Protocol";
var CHECKOUT_URL  = "/checkout";
var LEAD_ENDPOINT = "";     // your Airtable / Google Sheets webhook

var ICO = {
  spark:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>',
  phone:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>',
  chat: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>',
  cup:  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v6a5 5 0 0 1-10 0z"/><path d="M16 9h2.5a2.5 2.5 0 0 1 0 5H16"/><path d="M4 21h13"/></svg>',
  clock:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  fire: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 3.5 5.5 6 5.5 9.5A5.5 5.5 0 0 1 12 18a5.5 5.5 0 0 1-5.5-5.5C6.5 9 9 6.5 12 3z"/></svg>',
  cloud:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.6 1.4A3.5 3.5 0 0 1 17.5 18z"/></svg>',
  eye:  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  brain:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5a3 3 0 0 0-5.7-1.3A3 3 0 0 0 4 9.5a3.2 3.2 0 0 0 .6 4.4A3 3 0 0 0 8 19a3 3 0 0 0 4-1.3z"/><path d="M12 5.5a3 3 0 0 1 5.7-1.3A3 3 0 0 1 20 9.5a3.2 3.2 0 0 1-.6 4.4A3 3 0 0 1 16 19a3 3 0 0 1-4-1.3z"/></svg>',
  book: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 17.5h15"/></svg>',
  user: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
  heart:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-9.5A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg>',
  comp: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14110F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2E7D4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  arrow:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>'
};

var SCREENS = [

  /* ---------------- Your Profile ---------------- */
  { id:"situation", sec:"Your Profile", type:"q",
    q:"Where are you at with dating right now?",
    opts:[
      { id:"out",      ico:"cloud", label:"Completely out of the game" },
      { id:"apps",     ico:"phone", label:"On the apps, going nowhere" },
      { id:"dates",    ico:"cup",   label:"Getting dates that lead nowhere" },
      { id:"plenty",   ico:"fire",  label:"Dating plenty, nothing lasts" }
    ]},

  { id:"frequency", sec:"Your Profile", type:"q",
    q:"How often do you actually get to a first date?",
    opts:[
      { id:"never",    ico:"cloud", label:"Almost never — I'm not really trying" },
      { id:"rare",     ico:"clock", label:"Once every few months, if I'm lucky" },
      { id:"regular",  ico:"cal",   label:"Regularly — they just go nowhere" },
      { id:"constant", ico:"fire",  label:"Constantly — and I'm exhausted by it" }
    ]},

  { id:"duration", sec:"Your Profile", type:"q",
    q:"How long has it been like this?",
    opts:[
      { id:"weeks", label:"A few months" },
      { id:"year",  label:"About a year" },
      { id:"years", label:"Over a couple of years" },
      { id:"lost",  label:"I've lost count" }
    ]},

  { id:"int1", sec:"Your Profile", type:"info",
    lede:"You're closer than you think",
    body:"Most guys are stuck on one specific thing, not everything at once. A few more questions and you'll know which one is yours.",
    photo:"Put a real photo here — you, or a customer. Delete this block entirely rather than using a stock image; it undercuts everything else on the page.",
    cta:"Continue" },

  /* ---------------- Where It Breaks ---------------- */
  { id:"breakpoint", sec:"Where It Breaks", type:"q",
    q:"Where does it usually fall apart?",
    sub:"Pick the one that happens most often.",
    opts:[
      { id:"approach",   ico:"cloud", label:"Before it starts — I don't approach or match" },
      { id:"messages",   ico:"chat",  label:"In the messages — it dies before we meet" },
      { id:"first_date", ico:"cup",   label:"On the first date — no second one" },
      { id:"fade",       ico:"clock", label:"A few weeks in — it just cools off" }
    ]},

  { id:"feeling", sec:"Where It Breaks", type:"q",
    q:"Be honest — how does the whole thing make you feel?",
    opts:[
      { id:"frustrated", ico:"comp",  label:"Frustrated — I don't get what I'm doing wrong" },
      { id:"anxious",    ico:"brain", label:"Anxious — I overthink every message" },
      { id:"numb",       ico:"cloud", label:"Numb — I've stopped expecting much" },
      { id:"angry",      ico:"fire",  label:"Angry — I put in more than I get back" }
    ]},

  { id:"confidence", sec:"Where It Breaks", type:"q",
    q:"How do you feel walking into a first date?",
    opts:[
      { id:"good",     ico:"spark", label:"Pretty good — I enjoy them" },
      { id:"replay",   ico:"brain", label:"Fine at the time, then I replay it for days" },
      { id:"rehearse", ico:"eye",   label:"Nervous enough that I rehearse" },
      { id:"avoid",    ico:"cloud", label:"I mostly avoid setting them up" }
    ]},

  /* ---------------- Mindset & Goals ---------------- */
  { id:"tried", sec:"Mindset & Goals", type:"q",
    q:"What have you already tried?",
    opts:[
      { id:"nothing", ico:"cloud", label:"Nothing structured — just winging it" },
      { id:"free",    ico:"phone", label:"Free stuff — videos, podcasts, forums" },
      { id:"paid",    ico:"book",  label:"Paid for something that didn't work" },
      { id:"looks",   ico:"user",  label:"Changed how I look, still stuck" }
    ]},

  { id:"awareness", sec:"Mindset & Goals", type:"q",
    q:"Do you know what's actually holding you back?",
    opts:[
      { id:"no_idea",   ico:"cloud", label:"No idea, and that's the worst part" },
      { id:"theory",    ico:"brain", label:"I have a theory I can't prove" },
      { id:"cant_stop", ico:"comp",  label:"I know exactly what it is and can't stop" },
      { id:"dont_buy",  ico:"eye",   label:"I've been told, and I don't buy it" }
    ]},

  { id:"outcome", sec:"Mindset & Goals", type:"q",
    q:"If this were handled six months from now, what would that look like?",
    opts:[
      { id:"easy",    ico:"spark", label:"Meeting people without it being a production" },
      { id:"enjoy",   ico:"cup",   label:"Enjoying dates instead of surviving them" },
      { id:"one",     ico:"heart", label:"One person worth keeping" },
      { id:"knowhow", ico:"comp",  label:"Knowing what to do instead of guessing" }
    ]},

  /* ---------------- Almost There ---------------- */
  { id:"focus", sec:"Almost There", type:"multi",
    q:"What do you most want to work on?",
    sub:"Select all that apply.",
    opts:[
      { id:"opening", label:"Starting conversations without freezing" },
      { id:"texting", label:"Keeping a conversation going somewhere" },
      { id:"dates",   label:"Being better company on a date" },
      { id:"reading", label:"Reading interest accurately" },
      { id:"nerves",  label:"Not overthinking every move" },
      { id:"depth",   label:"Turning something early into something real" }
    ],
    cta:"Continue" },

  { id:"loading", sec:"Almost There", type:"load",
    lede:"Building your plan",
    steps:["Your goals","Your sticking point","Matching the right start"] },

  { id:"summary", sec:"Almost There", type:"summary", cta:"Continue" },

  { id:"contact", sec:"Almost There", type:"email",
    lede:"Where should we send your plan?",
    body:"We'll show it on the next screen and email you a copy so you don't lose it.",
    cta:"See my plan" }
];

// =========================================================================
// STATE
// =========================================================================

var KEY = "quiz.v2";
var A = {};
try { A = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ A = {}; }

var SECTIONS = [];
SCREENS.forEach(function(s){ if (SECTIONS.indexOf(s.sec) < 0) SECTIONS.push(s.sec); });

var i = 0;
var slug = location.pathname.split("/").filter(Boolean).pop();
SCREENS.forEach(function(s,n){ if (s.id === slug) i = n; });
if (SCREENS[i].type === "load") i = Math.max(0, i-1);

var topEl   = document.getElementById("top");
var segsEl  = document.getElementById("segs");
var stageEl = document.getElementById("stage");

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(A)); }catch(e){} }

// One shared event id so the browser Pixel and server-side CAPI dedupe
// instead of double-counting.
function track(name, data){
  var id = name + "." + Date.now() + "." + Math.random().toString(36).slice(2,10);
  if (window.fbq) fbq("trackCustom", name, data || {}, { eventID:id });
  return id;
}

function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x)n.textContent=x; return n; }

// =========================================================================
// HEADER + PROGRESS
// =========================================================================

function chrome(s){
  topEl.innerHTML = "";
  var b = el("button","back"); b.type="button"; b.innerHTML = ICO.arrow;
  b.setAttribute("aria-label","Go back");
  b.hidden = i === 0;
  b.onclick = prev;
  topEl.appendChild(b);

  var branded = s.type !== "q" && s.type !== "multi";
  if (branded){
    var l = el("div","logo");
    l.appendChild(el("div","mark", BRAND));
    l.appendChild(el("span",null,BRAND_NAME));
    topEl.appendChild(l);
  } else {
    topEl.appendChild(el("div","chip", s.sec));
  }
  topEl.appendChild(el("div","pad"));

  // One segment per section, filling as you move through that section.
  segsEl.innerHTML = "";
  segsEl.hidden = branded;
  if (branded) return;

  var here = SECTIONS.indexOf(s.sec);
  SECTIONS.forEach(function(name, n){
    var wrap = el("div","seg"), bar = el("i");
    var inSec = SCREENS.filter(function(x){ return x.sec === name; });
    var pos = inSec.indexOf(s);
    var pct = n < here ? 100 : n > here ? 0 : Math.round(((pos+1)/inSec.length)*100);
    wrap.appendChild(bar); segsEl.appendChild(wrap);
    requestAnimationFrame(function(){ bar.style.width = pct + "%"; });
  });
}

// =========================================================================
// SCREENS
// =========================================================================

var RENDER = {};

function render(){
  var s = SCREENS[i];
  stageEl.innerHTML = "";
  chrome(s);
  var path = "/start/" + s.id;
  if (location.pathname !== path) history.pushState({i:i}, "", path);
  track("QuizStep", { step:i+1, screen:s.id });
  RENDER[s.type](s);
  window.scrollTo(0,0);
}

RENDER.q = function(s){
  stageEl.appendChild(el("h1",null,s.q));
  if (s.sub) stageEl.appendChild(el("p","sub",s.sub));
  var wrap = el("div","opts");
  s.opts.forEach(function(o){
    var b = el("button","opt"); b.type="button";
    b.setAttribute("aria-pressed", A[s.id]===o.id ? "true":"false");
    if (o.ico){ var ic = el("span","ico"); ic.innerHTML = ICO[o.ico]; b.appendChild(ic); }
    b.appendChild(el("span","txt",o.label));
    b.onclick = function(){
      A[s.id] = o.id; save();
      wrap.querySelectorAll(".opt").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
      setTimeout(next, 220);
    };
    wrap.appendChild(b);
  });
  stageEl.appendChild(wrap);
};

RENDER.multi = function(s){
  stageEl.appendChild(el("h1",null,s.q));
  if (s.sub) stageEl.appendChild(el("p","sub",s.sub));
  var picked = A[s.id] || [];
  var wrap = el("div","opts");
  var go = el("button","cta",s.cta); go.type="button";

  s.opts.forEach(function(o){
    var b = el("button","opt"); b.type="button";
    b.setAttribute("aria-pressed", picked.indexOf(o.id)>=0 ? "true":"false");
    b.appendChild(el("span","txt",o.label));
    b.appendChild(el("span","box"));
    b.onclick = function(){
      var n = picked.indexOf(o.id);
      if (n >= 0) picked.splice(n,1); else picked.push(o.id);
      A[s.id] = picked; save();
      b.setAttribute("aria-pressed", n>=0 ? "false":"true");
      go.disabled = picked.length === 0;
    };
    wrap.appendChild(b);
  });
  stageEl.appendChild(wrap);

  go.disabled = picked.length === 0;
  go.onclick = next;
  var f = el("div","foot"); f.appendChild(go); stageEl.appendChild(f);
};

RENDER.info = function(s){
  stageEl.appendChild(el("h1","left",s.lede));
  stageEl.appendChild(el("p","para",s.body));
  if (s.photo) stageEl.appendChild(el("div","shot-note",s.photo));
  var b = el("button","cta",s.cta); b.type="button"; b.onclick = next;
  var f = el("div","foot"); f.appendChild(b); stageEl.appendChild(f);
};

RENDER.load = function(s){
  stageEl.appendChild(el("h1",null,s.lede));
  stageEl.appendChild(el("p","sub","This takes a few seconds."));
  var rows = el("div","rows"), bars = [];
  s.steps.forEach(function(label){
    var r = el("div","row"), lab = el("div","lab");
    lab.appendChild(el("span",null,label));
    var right = el("span","pct","0%");
    lab.appendChild(right);
    var bar = el("div","bar"), fillEl = el("i");
    bar.appendChild(fillEl); r.appendChild(lab); r.appendChild(bar);
    rows.appendChild(r);
    bars.push({ fill:fillEl, pct:right });
  });
  stageEl.appendChild(rows);

  var n = 0;
  (function run(){
    if (n >= bars.length){ setTimeout(next, 450); return; }
    var b = bars[n], v = 0;
    var t = setInterval(function(){
      v += Math.random()*18 + 9;
      if (v >= 100){
        v = 100; clearInterval(t);
        var ok = el("span","tick"); ok.innerHTML = ICO.check;
        b.pct.replaceWith(ok);
        n++; setTimeout(run, 230);
      } else {
        b.pct.textContent = Math.round(v) + "%";
      }
      b.fill.style.width = v + "%";
    }, 250);
  })();
};

// Derived honestly from what he actually answered.
function readiness(){
  var p = 0;
  if (A.frequency === "regular" || A.frequency === "constant") p += 2;
  else if (A.frequency === "rare") p += 1;
  if (A.confidence === "good") p += 2;
  else if (A.confidence === "replay") p += 1;
  if (A.awareness === "cant_stop" || A.awareness === "theory") p += 1;
  if (A.tried === "free" || A.tried === "paid") p += 1;
  if (A.duration === "weeks") p += 1;
  return Math.max(0, Math.min(8, p));
}

var BREAK = {
  approach:   { name:"Getting started",  line:"The problem happens before anyone talks to you. It's also the quickest of the four to shift." },
  messages:   { name:"The conversation", line:"Interest has a short shelf life. Most conversations die because nobody moved while it was still there." },
  first_date: { name:"The first date",   line:"Pleasant and forgettable loses to memorable every time. That's a skill, not a personality trait." },
  fade:       { name:"Making it last",   line:"Early dating runs on novelty. When that runs out something else has to hold — that's the gap." }
};

RENDER.summary = function(s){
  stageEl.appendChild(el("h1",null,"Your profile"));
  var r = readiness();
  var band = r <= 2 ? "Early" : r <= 5 ? "Building" : "Ready";

  var p = el("div","panel"), hd = el("div","hd");
  hd.appendChild(el("b",null,"Where you're starting"));
  hd.appendChild(el("span","badge",band));
  p.appendChild(hd);

  var g = el("div","gauge"), pin = el("div","pin");
  g.appendChild(pin); p.appendChild(g);
  requestAnimationFrame(function(){ pin.style.left = (8 + (r/8)*84) + "%"; });

  var sc = el("div","scale");
  ["Early","Building","Ready"].forEach(function(t){ sc.appendChild(el("span",null,t)); });
  p.appendChild(sc);

  var bp = BREAK[A.breakpoint] || BREAK.messages;
  var nt = el("div","note");
  nt.appendChild(el("b",null,"Your sticking point: " + bp.name));
  nt.appendChild(el("span",null,bp.line));
  p.appendChild(nt);
  stageEl.appendChild(p);

  var tiles = el("div","tiles");
  [["Been stuck",     {weeks:"Months",year:"About a year",years:"A few years",lost:"A long time"}[A.duration]],
   ["Tried before",   {nothing:"Not yet",free:"Free material",paid:"Paid programs",looks:"Appearance"}[A.tried]],
   ["Self-awareness", {no_idea:"Low",theory:"Partial",cant_stop:"High",dont_buy:"Mixed"}[A.awareness]],
   ["Wants",          {easy:"Ease",enjoy:"Enjoyment",one:"Something real",knowhow:"A method"}[A.outcome]]
  ].forEach(function(t){
    var d = el("div","tile");
    d.appendChild(el("small",null,t[0]));
    d.appendChild(el("b",null,t[1] || "—"));
    tiles.appendChild(d);
  });
  stageEl.appendChild(tiles);

  var b = el("button","cta",s.cta); b.type="button"; b.onclick = next;
  var f = el("div","foot"); f.appendChild(b); stageEl.appendChild(f);
};

RENDER.email = function(s){
  stageEl.appendChild(el("h1",null,s.lede));
  stageEl.appendChild(el("p","sub",s.body));

  var mail = el("input","inp");
  mail.type = "email"; mail.placeholder = "Enter your email";
  mail.autocomplete = "email"; mail.value = A.email || "";
  stageEl.appendChild(mail);

  // Honeypot — real people never fill this in, bots usually do.
  var trap = el("input","trap");
  trap.type = "text"; trap.name = "company"; trap.tabIndex = -1;
  trap.setAttribute("autocomplete","off");
  stageEl.appendChild(trap);

  var err = el("p","err",""); err.hidden = true;
  stageEl.appendChild(err);
  stageEl.appendChild(el("p","fine","We'll email a copy of your plan. Unsubscribe any time."));

  var b = el("button","cta",s.cta); b.type="button";
  b.onclick = function(){
    err.hidden = true;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim())){
      err.textContent = "That email doesn't look right.";
      err.hidden = false;
      return;
    }
    if (trap.value) return;
    A.email = mail.value.trim(); save();
    b.disabled = true; b.textContent = "One moment";
    post().then(done).catch(done);
    function done(){ location.href = CHECKOUT_URL; }
  };

  var f = el("div","foot");
  f.appendChild(b);
  var lg = el("p","legal");
  lg.innerHTML = 'By continuing you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.';
  f.appendChild(lg);
  stageEl.appendChild(f);
};

function post(){
  track("Lead", { breakpoint:A.breakpoint });
  if (!LEAD_ENDPOINT) return Promise.resolve();
  return fetch(LEAD_ENDPOINT, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(A)
  });
}

// =========================================================================
// NAV
// =========================================================================

function next(){ if (i < SCREENS.length - 1){ i++; render(); } }

function prev(){
  if (i <= 0) return;
  i--;
  if (SCREENS[i].type === "load") i--;   // never land back on the animation
  history.replaceState({i:i}, "", "/start/" + SCREENS[i].id);
  render();
}

window.addEventListener("popstate", function(e){
  if (e.state && typeof e.state.i === "number"){
    i = e.state.i;
    if (SCREENS[i].type === "load") i = Math.max(0, i-1);
    render();
  }
});

render();
</script>
